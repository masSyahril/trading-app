<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TradeLite - Major Companies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">TradeLite</div>
        <div class="search"></div>
        <div class="actions">
          <a href="./" class="secondary" title="Back to stock trading">Back</a>
        </div>
      </header>

      <main class="main" style="padding: 16px;">
        <div class="panel">
          <div class="panel-title">Major Companies</div>
          <div style="margin-bottom: 12px; display:flex; gap:12px; align-items:center; flex-wrap: wrap;">
            <div>
              <input id="file-input" type="file" accept=".csv,.xlsx,.xls,text/csv" />
              <button id="import" class="primary">Import CSV</button>
            </div>
            <button id="refresh" class="secondary">Refresh</button>
            <button id="clear-local" class="secondary" title="Remove locally imported data">Clear Local Data</button>
            <small style="opacity:0.8">Import your Nasdaq CSVs to populate this list. We’ll compute MACD in the chart.</small>
          </div>
          <table class="table" id="companies-table">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Name</th>
                <th>Last</th>
                <th>Prev Close</th>
                <th>Change</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>

      <footer class="footer">
        <div>Demo app. Not investment advice.</div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="companies.prod.js"></script>
  </body>
</html>
