        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;

        color: #00d4aa;

        background: #0b0f14;

        margin-bottom: 0.75rem;
        color: #00d4aa;

    <script>
      // Initialize beautiful loading system
      document.addEventListener('DOMContentLoaded', async () => {
        try {
          // Create script loader with custom scripts for stock platform
          await ScriptLoader.loadTradingScripts([
