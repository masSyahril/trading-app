    <style>
        /* Crypto layout: fixed main chart + predictable indicator panel heights; scroll inside #indicators-container */
        :root {
            --crypto-main-chart-height: 300px;
            --crypto-indicator-chart-height: 156px;
            --crypto-touch-min: 44px;
        }
        /* Android / mobile: dynamic viewport + legacy Chrome fallback (address bar) */
        html {
            height: 100%;
            height: -webkit-fill-available;
        }
        body {
            min-height: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            background-color: #020617;
            color: #e2e8f0;
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .indicator-panel { transition: all 0.3s ease-in-out; }
        #chart {
            height: var(--crypto-main-chart-height) !important;
            min-height: var(--crypto-main-chart-height) !important;
            max-height: var(--crypto-main-chart-height) !important;
            flex-shrink: 0 !important;
            box-sizing: border-box;
            width: 100%;
            touch-action: pan-x pan-y pinch-zoom;
        }
        /* Fills remaining space under the chart; no vh/min-height fights */
        #indicators-section {
            flex: 1 1 0 !important;
            min-height: 0 !important;
            max-height: none !important;
            height: auto !important;
            overflow: hidden !important;
            overscroll-behavior-y: contain;
        }
        @media (max-width: 768px) {
            :root {
                /* Shorter phones: cap chart with dvh so indicators keep room */
                --crypto-main-chart-height: min(240px, 32dvh);
                --crypto-indicator-chart-height: 120px;
            }
            #indicators-section {
                flex: 1 1 0 !important;
                min-height: 0 !important;
                max-height: none !important;
            }
        }
        @media (max-width: 480px) {
            :root {
                --crypto-main-chart-height: min(220px, 30dvh);
                --crypto-indicator-chart-height: 112px;
            }
        }
        /* Landscape phone: leave vertical room for indicators */
        @media (max-height: 500px) and (orientation: landscape) {
            :root {
                --crypto-main-chart-height: min(180px, 38vh);
                --crypto-indicator-chart-height: 100px;
            }
        }
        #indicators-container {
            overflow-y: auto !important;
            overflow-x: hidden !important;
            flex: 1 1 0 !important;
            min-height: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            box-sizing: border-box;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        #sidebar { width: 200px !important; }
        /* Mobile order rail: bounded height + internal scroll (Android stack layout) */
        .crypto-order-rail {
            flex-shrink: 0;
        }
        @media (max-width: 1023px) {
            .crypto-order-rail {
                max-height: min(38dvh, 300px);
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-y: contain;
            }
        }
        @media (max-width: 1023px) {
            .crypto-touch-target {
                min-height: var(--crypto-touch-min);
                min-width: var(--crypto-touch-min);
                touch-action: manipulation;
            }
            .crypto-chart-toolbar-mobile button.tab-btn,
            .crypto-chart-toolbar-mobile button[type="button"] {
                min-height: 36px;
                min-width: 36px;
                padding-left: 0.5rem;
                padding-right: 0.5rem;
                font-size: 11px;
            }
        }
        /* Panels stack at natural height; scroll the container (override shared multi-indicator flex-grow) */
        #indicators-container .indicator-panel:not(.minimized) {
            flex: 0 0 auto !important;
            min-height: 0 !important;
            max-height: none !important;
        }
        #indicators-container .indicator-panel:not(.minimized) .indicator-chart {
            height: var(--crypto-indicator-chart-height) !important;
            min-height: var(--crypto-indicator-chart-height) !important;
            max-height: var(--crypto-indicator-chart-height) !important;
            flex: 0 0 auto !important;
        }
        .indicator-panel.minimized {
            flex: 0 0 40px !important;
            min-height: 40px !important;
            max-height: 40px !important;
            height: 40px !important;
        }
        #chart-toolbar { transition: opacity 0.2s ease; }
        #chart-toolbar:hover {
            background: rgba(15, 23, 42, 0.95) !important;
        }
        #chart-toolbar button {
            user-select: none;
            -webkit-user-select: none;
        }
        .crypto-orders-scroll { max-height: 140px; overflow-y: auto; }
        @media (max-width: 1023px) {
            .crypto-orders-scroll { max-height: 120px; }
        }

        /* Profile dropdown */
        .profile-dropdown { animation: dropIn .15s ease; }
        @keyframes dropIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
        .profile-menu-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 8px;
            font-size: 13px; font-weight: 500;
            transition: background .15s; cursor: pointer;
            border: none; background: transparent; font-family: inherit;
        }
        .profile-menu-icon { font-size: 14px; width: 18px; text-align: center; }
        #profile-role-badge.admin { background: rgba(99,102,241,.15); color: #a5b4fc; border-color: rgba(99,102,241,.3); }
        #profile-role-badge.user  { background: rgba(100,116,139,.1); color: #94a3b8; border-color: rgba(100,116,139,.25); }
    </style>
</head>

    <script>
        /* Same indicator stack as stock-market/index.html; app entry last. */
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await ScriptLoader.loadTradingScripts([
                    { name: 'utils', src: '../src/js/core/utils.js', description: 'Core Utilities' },
                    { name: 'indicators', src: '../src/js/utils/indicators.js', description: 'Chart Indicators' },
                    { name: 'technical-indicators', src: '../src/js/core/technical-indicators.js', description: 'Technical Analysis' },
                    { name: 'HullMA', src: '../src/js/core/Wang_design__HullMA%20_2026-01-18.js', description: 'Prof. Wang Hull MA (window.computeHullMA)' },
                    { name: 'DEMA', src: '../src/js/core/Wang_design_DEMA_2026-03-14.js', description: 'Prof. Wang DEMA (window.computeDEMA)' },
                    { name: 'technical-indicators-wang', src: '../src/js/core/technical-indicators-wang.js', description: 'Prof. Wang Indicators' },
                    { name: 'technical-indicators-wang-prods', src:'../src/js/core/technical-indicators.prods__Wang__2026-04-30.js', description:'Prof. Wang Indicators (prod bundle)' },
                    { name: 'multi-indicator-system', src: '../src/js/core/multi-indicator-system.js', description: 'Multi-Panel System' },
                    { name: 'RWI', src: '../src/js/core/Wang_design_new_indicators__RandomWalkIndex _2026-01-20.js', description: 'RWI indicator' },
                    { name: 'MAoneMAtwo', src: '../src/js/core/Wang_design__MAoneMAtwor_2026-04-06.js', description: 'MAoneMAtwo indicator' },
                    { name: 'crypto-app', src: 'crypto-app.prod.js', description: 'Crypto Platform' },
                ]);
                lucide.createIcons();
            } catch (error) {
                console.error('Script loading failed:', error);
            }
        });

        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            } 
        }
        // Profile dropdown toggle
        const profileBtn      = document.getElementById('profile-btn');
        const profileDropdown = document.getElementById('profile-dropdown');
        profileBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown?.classList.toggle('hidden');
        });
        document.addEventListener('click', () => profileDropdown?.classList.add('hidden'));
        profileDropdown?.addEventListener('click', (e) => e.stopPropagation());

        // Populate profile dropdown on auth
        document.addEventListener('auth:ready', (e) => {
            const u   = e.detail?.user;
            const bal = e.detail?.balance;

            if (u) {
                const initials = u.username.slice(0, 2).toUpperCase();
                document.getElementById('profile-avatar').textContent    = initials;
                document.getElementById('profile-avatar-lg').textContent = initials;
                document.getElementById('username-display').textContent  = u.username;
                document.getElementById('profile-username').textContent  = u.username;
                document.getElementById('profile-email').textContent     = u.email || '—';

                const badge = document.getElementById('profile-role-badge');
                if (badge) { badge.textContent = u.role; badge.className = `mt-1 inline-block text-[10px] font-semibold px-1.5 py-0.5 rounded border ${u.role}`; }

                if (u.role === 'admin') {
                    document.getElementById('admin-link')?.classList.remove('hidden');
                }
            }

            if (bal != null) {
                const fmt = '$' + bal.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                document.getElementById('balance-display').textContent = fmt;
            }
        });

        // Logout
        document.getElementById('logout-btn')?.addEventListener('click', async () => {
            await fetch('../api/auth/logout.php', { method: 'POST', credentials: 'include' });
            window.location.replace('../auth/login.html');
        });

        document.getElementById('menu-btn')?.addEventListener('click', toggleSidebar);
        document.getElementById('close-sidebar')?.addEventListener('click', toggleSidebar);
        backdrop?.addEventListener('click', toggleSidebar);
    </script>
