<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeFlow - Stock Market</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    
    <!-- Indicator Styles -->
    <link rel="stylesheet" href="../src/css/multi-indicator-styles.css">
    
    <!-- Custom Config for Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for webkit */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { background-color: #020617; color: #e2e8f0; }
        
        /* Smooth transitions for indicator resizing */
        .indicator-panel { transition: all 0.3s ease-in-out; }
        
        /* Chart container sizing - smaller main chart to give more space to indicators */
        /* Match width/layout with indicator panels for time-axis alignment */
        #chart {
            height: 35vh !important; /* Reduced from 40vh to make room for indicators */
            min-height: 250px !important;
            max-height: 400px !important;
            box-sizing: border-box;
            width: 100%;
        }
        
        /* Indicator section - bigger to see data/lines better, accommodate up to 5 indicators */
        #indicators-section {
            height: 65vh !important; /* Increased from 60vh to give more space for all 3 indicators */
            min-height: 650px !important; /* Increased for better visibility at 100% zoom */
            max-height: 75vh !important; /* Increased max height */
        }
        
        /* Mobile: Adjust indicators section height */
        @media (max-width: 768px) {
            #indicators-section {
                height: auto !important;
                min-height: 0 !important;
                max-height: 50vh !important; /* Allow more space for scrolling */
                flex: 1 1 auto !important;
            }
        }
        
        /* Ensure indicator container can scroll if needed and show all data */
        /* Same width as #chart so time axis aligns with main chart */
        #indicators-container {
            overflow-y: auto !important;
            overflow-x: hidden !important;
            min-height: 0 !important; /* Allow proper flex scrolling */
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            box-sizing: border-box;
            scrollbar-gutter: stable; /* Reserve scrollbar space so content width matches #chart */
        }
        
        /* Watchlist - smaller sidebar */
        #sidebar {
            width: 200px !important; /* Smaller watchlist */
        }
        
        /* Ensure indicators are always visible and properly sized */
        .indicator-panel:not(.minimized) {
            flex: 1 1 auto;
            min-height: 140px;
            max-height: none; /* Allow panels to grow as needed */
        }
        
        /* When minimized, take minimal space */
        .indicator-panel.minimized {
            flex: 0 0 40px !important;
            min-height: 40px !important;
            max-height: 40px !important;
            height: 40px !important;
        }
        
        /* Market status badge styling */
        .market-status-compact {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .status-dot-compact {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Chart toolbar styling - positioned inside chart */
        #chart-toolbar {
            transition: opacity 0.2s ease;
        }
        
        #chart-toolbar:hover {
            background: rgba(15, 23, 42, 0.95) !important;
        }
        
        /* Ensure toolbar doesn't interfere with chart interactions */
        #chart-toolbar button {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Draggable RR modal */
        #rr-modal[hidden] { display: none !important; }
        #rr-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none; /* let only the panel take events */
        }
        #rr-modal .rr-panel {
            position: absolute;
            top: 96px;
            left: 96px;
            width: 45vw;
            max-width: 45vw;
            min-width: 320px;
            min-height: 220px;
            max-height: 85vh;
            background: rgba(15, 23, 42, 0.96);
            border: 3px solid rgba(51, 65, 85, 0.9);
            border-radius: 12px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
            pointer-events: auto;
            backdrop-filter: blur(10px);
            resize: both;
            overflow: auto;
            --rr-scale: 1;
            font-size: calc(24px * var(--rr-scale));
        }
        @media (max-width: 640px) {
            #rr-modal .rr-panel {
                width: 92vw;
                max-width: 92vw;
                left: 4vw;
                top: 80px;
            }
        }
        #rr-modal .rr-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: calc(10px * var(--rr-scale));
            padding: calc(10px * var(--rr-scale)) calc(12px * var(--rr-scale));
            border-bottom: 1px solid rgba(51, 65, 85, 0.7);
            cursor: grab;
            user-select: none;
        }
        #rr-modal .rr-header:active { cursor: grabbing; }
        #rr-modal .rr-body {
            padding: calc(24px * var(--rr-scale));
        }
        #rr-modal .rr-close {
            padding: calc(6px * var(--rr-scale)) calc(8px * var(--rr-scale));
            border-radius: calc(8px * var(--rr-scale));
        }
        #rr-modal .rr-close:hover {
            background: rgba(51, 65, 85, 0.45);
        }

        /* Make RR modal controls scale nicely */
        #rr-modal .rr-panel input {
            font-size: calc(24px * var(--rr-scale));
            padding: calc(4px * var(--rr-scale)) calc(8px * var(--rr-scale));
        }
        #rr-modal .rr-panel button {
            font-size: calc(24px * var(--rr-scale));
            padding: calc(8px * var(--rr-scale)) calc(12px * var(--rr-scale));
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden font-sans">
    <!-- HEADER -->

            </div>

                <i data-lucide="refresh-cw" class="w-5 h-5 text-slate-300"></i>
            </button>
            <a href="companies.html" class="p-2 hover:bg-slate-800 rounded-full" title="Companies">

            </a>
            <button id="calculate-rr" class="p-2 hover:bg-slate-800 rounded-full" title="calculate RR">

    <!-- MAIN LAYOUT -->

        <aside id="sidebar" class="absolute lg:static inset-y-0 left-0 w-[220px] bg-slate-900 border-r border-slate-700 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 z-40 flex flex-col">

            </div>
            <ul id="watchlist" class="flex-1 overflow-y-auto no-scrollbar">

            </ul>
        </aside>
        
        <!-- BACKDROP (Mobile) -->
        <div id="backdrop" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>
        
        <!-- CENTER CONTENT -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-950">
            <!-- VISUALIZATION AREA -->
            <div class="flex-1 flex flex-col min-h-0">
                <!-- MAIN K-LINE CHART - Smaller -->
                <div id="chart" class="w-full bg-slate-950 border-b border-slate-800 relative">
                    <!-- CHART TOOLBAR - Positioned inside chart, top-right corner - Smaller size -->
                    <div id="chart-toolbar" class="absolute top-1 right-32 z-10 bg-slate-900/90 backdrop-blur-sm border border-slate-700/50 rounded flex items-center px-1 py-0.5 gap-0.5 shadow-lg scale-90 origin-top-right">
                        <button class="tab-btn px-1.5 py-0.5 text-[18px] text-slate-400 hover:text-white rounded transition-colors" data-tf="1d">1D</button>
                        <button class="tab-btn px-1.5 py-0.5 text-[18px] text-blue-400 bg-slate-700/50 rounded font-bold active" data-tf="5d">5D</button>
                        <button class="tab-btn px-1.5 py-0.5 text-[18px] text-slate-400 hover:text-white rounded transition-colors" data-tf="1m">1M</button>
                        <button class="tab-btn px-1.5 py-0.5 text-[18px] text-slate-400 hover:text-white rounded transition-colors" data-tf="3m">3M</button>
                        <button class="tab-btn px-1.5 py-0.5 text-[18px] text-slate-400 hover:text-white rounded transition-colors" data-tf="1y">1Y</button>
                        <div class="w-px h-3 bg-slate-600 mx-0.5"></div>
                        <div class="flex items-center gap-0.5">
                            <button id="btn-pan-left" class="px-1 py-0.5 text-[18px] text-slate-300 hover:text-white hover:bg-slate-700/50 rounded transition-colors" title="Pan Left">←</button>
                            <button id="btn-pan-right" class="px-1 py-0.5 text-[18px] text-slate-300 hover:text-white hover:bg-slate-700/50 rounded transition-colors" title="Pan Right">→</button>
                            <button id="btn-reset-view" class="px-1 py-0.5 text-[18px] text-slate-300 hover:text-white hover:bg-slate-700/50 rounded transition-colors" title="Reset">Reset</button>
                            <div class="w-px h-3 bg-slate-600 mx-0.5"></div>
                            <button id="btn-jump-first" class="px-1 py-0.5 text-[18px] text-slate-300 hover:text-white hover:bg-slate-700/50 rounded transition-colors" title="Jump to First"><<</button>
                            <button id="btn-jump-last" class="px-1 py-0.5 text-[18px] text-slate-300 hover:text-white hover:bg-slate-700/50 rounded transition-colors" title="Jump to Last">>></button>
                        </div>
                    </div>
                    <!-- Chart will be injected here -->
                </div>
                
                <!-- INDICATOR SECTION - Bigger for better visibility, always show 3 -->
                <div id="indicators-section" class="flex flex-col bg-slate-720 border-t-4 border-slate-350 resize-y overflow-hidden">
                    <div class="bg-slate-800 h-5 flex items-center px-2 justify-between shrink-0 select-none">
                        <span id="indicator-count" class="text-xs font-bold text-slate-120 uppercase tracking-wider">Indicators (3)</span>
                        <button id="add-indicator-btn" class="flex items-center gap-1 text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-0.5 rounded transition-colors">
                            <i data-lucide="plus" class="w-3 h-3"></i> Add

                    </div>
                    
                    <!-- Indicator List Container - Scrollable to accommodate up to 5 indicators -->
                    <div id="indicators-container" class="flex flex-col flex-1 overflow-y-auto w-full" style="min-height: 12;">
                        <!-- Dynamic Indicators injected here -->

    <!-- <footer>This is a footer</footer> -->

    <!-- Script Loading System -->
    <script src="../src/js/utils/script-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await ScriptLoader.loadTradingScripts([
                    { name: 'utils', src: '../src/js/core/utils.js', description: 'Core Utilities' },
                    { name: 'indicators', src: '../src/js/utils/indicators.js', description: 'Chart Indicators' },
                    { name: 'technical-indicators', src: '../src/js/core/technical-indicators.js', description: 'Technical Analysis' },
                    { name: 'HullMA', src: '../src/js/core/Wang_design__HullMA%20_2026-01-18.js', description: 'Prof. Wang Hull MA (window.computeHullMA)' },
                    { name: 'DEMA', src: '../src/js/core/Wang_design_DEMA_2026-03-14.js', description: 'Prof. Wang DEMA (window.computeDEMA)' },
                    { name: 'technical-indicators-wang', src: '../src/js/core/technical-indicators-wang.js', description: 'Prof. Wang Indicators' },
                    { name: 'multi-indicator-system', src: '../src/js/core/multi-indicator-system.js', description: 'Multi-Panel System' },
                    { name: 'stock-app', src: 'stock-app.prod.js', description: 'Stock Platform' },
                    { name: 'RWI', src:'../src/js/core/Wang_design_new_indicators__RandomWalkIndex _2026-01-20.js', descrption:'RWI indicator'},
                    { name: 'MAoneMAtwo', src:'../src/js/core/Wang_design__MAoneMAtwor_2026-04-06.js', descrption:'MAoneMAtwo indicator'},
                    { name: 'technical-indicators-wang-prods', src:'../src/js/core/technical-indicators.prods__Wang__2026-04-30.js', descrption:'Prof. Wang Indicators (prod bundle)' },
                ]);
                
                console.log('✨ All stock platform scripts loaded successfully!');
                lucide.createIcons();
            } catch (error) {
                console.error('❌ Script loading failed:', error);
            }
        });

        // RR modal: open/close + draggable panel
        (() => {
            const openBtn = document.getElementById('calculate-rr') || document.getElementById('calculte-rr');
            const modal = document.getElementById('rr-modal');
            const panel = modal?.querySelector('.rr-panel');
            const handle = document.getElementById('rr-modal-handle');
            const closeBtn = document.getElementById('rr-modal-close');

            if (!openBtn || !modal || !panel || !handle || !closeBtn) return;

            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

            function openModal() {
                modal.hidden = false;
                modal.setAttribute('aria-hidden', 'false');
                lucide?.createIcons?.();
            }

            function closeModal() {
                modal.hidden = true;
                modal.setAttribute('aria-hidden', 'true');
            }

            openBtn.addEventListener('click', (e) => {
                e.preventDefault();
                openModal();
            });
            closeBtn.addEventListener('click', closeModal);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.hidden) closeModal();
            });

            let dragging = false;
            let startX = 0, startY = 0, startLeft = 0, startTop = 0;

            function onPointerDown(e) {
                if (e.button !== undefined && e.button !== 0) return; // left click only
                // Don't start dragging from interactive elements inside the header
                if (e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, [role="button"]')) return;
                dragging = true;
                const rect = panel.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                handle.setPointerCapture?.(e.pointerId);
            }

            function onPointerMove(e) {
                if (!dragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                const maxLeft = window.innerWidth - panel.offsetWidth - 8;
                const maxTop = window.innerHeight - panel.offsetHeight - 8;
                const nextLeft = clamp(startLeft + dx, 8, Math.max(8, maxLeft));
                const nextTop = clamp(startTop + dy, 8, Math.max(8, maxTop));

                panel.style.left = `${nextLeft}px`;
                panel.style.top = `${nextTop}px`;
            }

            function onPointerUp() {
                dragging = false;
            }

            handle.addEventListener('pointerdown', onPointerDown);
            closeBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);

            // Scale content based on panel size (so bigger panel = bigger, roomier UI)
            const applyScale = () => {
                const w = panel.offsetWidth || 420;
                const h = panel.offsetHeight || 300;
                const baseW = 420;
                const baseH = 320;
                // Weighted scale; clamp so it never gets silly
                const raw = (w / baseW) * 0.75 + (h / baseH) * 0.25;
                const scale = Math.max(0.95, Math.min(1.25, raw));
                panel.style.setProperty('--rr-scale', String(scale));
            };
            applyScale();
            if ('ResizeObserver' in window) {
                const ro = new ResizeObserver(applyScale);
                ro.observe(panel);
            } else {
                window.addEventListener('resize', applyScale);
            }

            // Ensure panel stays in bounds when resizing
            window.addEventListener('resize', () => {
                const rect = panel.getBoundingClientRect();
                const maxLeft = window.innerWidth - panel.offsetWidth - 8;
                const maxTop = window.innerHeight - panel.offsetHeight - 8;
                panel.style.left = `${clamp(rect.left, 8, Math.max(8, maxLeft))}px`;
                panel.style.top = `${clamp(rect.top, 8, Math.max(8, maxTop))}px`;
            });
        })();
        
        // Sidebar Toggle Logic
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        
        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }
        
        document.getElementById('menu-btn')?.addEventListener('click', toggleSidebar);
        document.getElementById('close-sidebar')?.addEventListener('click', toggleSidebar);
        backdrop?.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
